name: Real V0.1 Integration CI

on:
  push:
    branches:
      - integration/real-v0.1
  pull_request:
    branches:
      - main
      - local-latest

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --silent

      - name: Synchronize dependency lock
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize dependency lock"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-output.txt

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build-output.txt
          if-no-files-found: ignore
