name: Deploy Real V0.1 Preview

on:
  push:
    branches:
      - integration/real-v0.1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build preview
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report preview result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "${PAGE_URL}" ]; then
            gh pr comment 3 --body "Pages preview deployment: ${DEPLOY_OUTCOME}. ${PAGE_URL}"
          else
            gh pr comment 3 --body "Pages preview deployment: ${DEPLOY_OUTCOME}. No Pages URL was produced; check repository Settings → Pages and the workflow run."
          fi
