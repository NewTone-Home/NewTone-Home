<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">永和小馆 A1 布局 Preview 候选</title>
  <desc id="desc">矿区窄店面与永和小馆室内布局候选。左侧工作，右侧顾客，中间柜台由重复文字组成；上端员工通口可穿越。两桌、菜单和四个调查点都位于真实可达区域。此图仍为 Preview，不定 canon。</desc>
  <defs>
    <style>
      text{font-family:'Microsoft YaHei',sans-serif;fill:#2d2a25}.title{font-size:26px;font-weight:700}.sub{font-size:14px;fill:#625a50}.label{font-size:15px;font-weight:600}.small{font-size:12px}.tiny{font-size:10px}.room{fill:#f7f1e7;stroke:#685746;stroke-width:2}.work{fill:#eee5d9}.customer{fill:#f3ebdf}.table{fill:#cda879;stroke:#74583c;stroke-width:1.4}.chair{fill:#e5d4bb;stroke:#826b50;stroke-width:1}.fixture{fill:#d7c5a8;stroke:#806c51;stroke-width:1}.route{stroke:#41686a;stroke-width:2;stroke-dasharray:5 4;fill:none}.counter-envelope{fill:none;stroke:#8c6444;stroke-width:.11;stroke-dasharray:.35 .28}.station{fill:#41686a;stroke:white;stroke-width:.08}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f9f7f2"/>
  <text x="42" y="48" class="title">永和小馆｜A1 布局 Preview 候选</text>
  <text x="42" y="74" class="sub">按矿区窄店面和小馆经营使用组织；位置与桌数均待画面验收，不作为正式设定。</text>

  <text x="48" y="125" class="label">矿区外围街（现有单侧店铺与工业边缘布局）</text>
  <g transform="translate(58 148) scale(4.4)">
    <rect x="0" y="0" width="10" height="141" fill="#d7d0c5" stroke="#766e63"/>
    <rect x="10" y="0" width="28" height="141" fill="#d8c8b1" stroke="#766e63"/>
    <rect x="38" y="0" width="14" height="141" fill="#d6d9d3" stroke="#766e63"/>
    <rect x="52" y="0" width="16" height="141" fill="#9b9a92" stroke="#625f58"/>
    <g fill="#e8dccb" stroke="#887663" stroke-width=".4">
      <rect x="10" y="6" width="14" height="14"/><rect x="10" y="21" width="28" height="28"/>
      <rect x="10" y="50" width="14" height="14"/><rect x="10" y="65" width="14" height="14"/><rect x="10" y="80" width="14" height="14"/><rect x="10" y="95" width="14" height="14"/><rect x="10" y="110" width="14" height="14"/><rect x="10" y="125" width="14" height="14"/>
    </g>
    <g class="tiny" text-anchor="middle"><text x="17" y="14">小店1</text><text x="24" y="36">永和小馆</text><text x="17" y="59">药店</text><text x="17" y="74">杂货</text><text x="17" y="89">小店</text><text x="17" y="104">食品</text><text x="17" y="119">小店</text><text x="17" y="134">小店8</text></g>
    <text transform="translate(5 70) rotate(-90)" text-anchor="middle" class="tiny">狭窄后巷</text>
    <text transform="translate(45 70) rotate(-90)" text-anchor="middle" class="small">公共街道</text>
    <text transform="translate(60 70) rotate(-90)" text-anchor="middle" class="tiny">工业边缘</text>
    <path d="M38 32 L38 38" class="route"/><text x="39.5" y="36" class="tiny">前门</text>
    <g fill="#aa8060" stroke="#624a36" stroke-width=".45"><rect x="41.4" y="24.9" width="3.2" height="3.2"/><rect x="41.4" y="41.9" width="3.2" height="3.2"/><circle cx="43" cy="23.4" r=".65"/><circle cx="43" cy="29.6" r=".65"/><circle cx="43" cy="40.4" r=".65"/><circle cx="43" cy="46.6" r=".65"/></g>
  </g>

  <text x="470" y="125" class="label">永和小馆室内（逻辑范围 28 × 28；实际尺寸仍待验证）</text>
  <g transform="translate(480 154) scale(17)">
    <rect x="10" y="21" width="12.25" height="28" class="work"/>
    <rect x="25.75" y="21" width="12.25" height="28" class="customer"/>
    <rect x="10" y="21" width="28" height="28" class="room"/>
    <path d="M38 30 L38 40" stroke="#f9f7f2" stroke-width=".4"/>
    <path d="M10 41 L10 49" stroke="#f9f7f2" stroke-width=".4"/>
    <path d="M10 41 L10 49" stroke="#9b5341" stroke-width=".15" stroke-dasharray=".3 .3"/>
    <text x="38.5" y="35" class="tiny">右前门</text>
    <text x="9.5" y="46" text-anchor="end" class="tiny">左下锁门</text>
    <text x="16" y="24" text-anchor="middle" class="tiny">工作区</text>
    <text x="32" y="24" text-anchor="middle" class="tiny">顾客区</text>

    <rect x="12" y="28" width="4" height="4" rx=".25" class="fixture"/><text x="14" y="30.5" text-anchor="middle" style="font-size:.52px">备菜台</text>
    <rect x="17" y="36" width="4" height="4" rx=".25" class="fixture"/><text x="19" y="38.5" text-anchor="middle" style="font-size:.56px">灶台</text>
    <circle cx="21.1" cy="40.5" r=".42" class="station"/><text x="19" y="42" text-anchor="middle" class="tiny">盛装／柜台交接侧</text>

    <rect x="22.25" y="26" width="3.5" height="22" class="counter-envelope"/>
    <g text-anchor="middle" style="font-size:1.85px;fill:#694b33;font-weight:600">
      <text x="24" y="27.8">柜台</text><text x="24" y="30.25">柜台</text><text x="24" y="32.7">柜台</text><text x="24" y="35.15">柜台</text><text x="24" y="37.6">柜台</text><text x="24" y="40.05">柜台</text><text x="24" y="42.5">柜台</text><text x="24" y="44.95">柜台</text><text x="24" y="47.4">柜台</text>
    </g>
    <path d="M24 25.7 L24 23.3" class="route"/><text x="26.5" y="23.7" class="tiny">上端员工通口（实际可走）</text>
    <path d="M34 35 L28.5 36 L24 24 L17 30 L19 38 L21 40.5" class="route"/>

    <text x="37.7" y="26.4" text-anchor="end" style="font-size:1.15px">菜单</text>
    <circle cx="34.5" cy="26" r=".3" class="station"/>
    <text x="34" y="28.2" text-anchor="middle" class="tiny">菜单查看点</text>

    <rect x="28.8" y="28.3" width="3.4" height="2.4" class="table"/><circle cx="30.5" cy="26.3" r=".62" class="chair"/><circle cx="30.5" cy="32.7" r=".62" class="chair"/>
    <rect x="31.3" y="41.8" width="3.4" height="2.4" class="table"/><circle cx="33" cy="39.8" r=".62" class="chair"/><circle cx="33" cy="46.2" r=".62" class="chair"/>
    <circle cx="30.5" cy="29.5" r=".3" class="station"/><circle cx="24" cy="36.95" r=".3" class="station"/><circle cx="33" cy="43" r=".3" class="station"/>
    <circle cx="14" cy="45" r=".3" class="station"/>
    <path d="M34 35 L34 36 L28.5 36" class="route"/>
  </g>
  <text x="470" y="665" class="small">候选：两张小桌上下错位，桌面横向、椅子分列桌子上下；不挡右前门。室外两桌仍在前门街道两侧。</text>
  <text x="470" y="686" class="small">柜台字面单元沿用 Café 的重复文字模式；虚线只标共享连续碰撞范围，不代表实心色块。四观察状态与文案沿用既有 ID。</text>
</svg>
